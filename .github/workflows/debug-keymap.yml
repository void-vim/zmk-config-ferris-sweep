name: Debug keymap build
# Builds the keymap outside the reusable ZMK workflow and posts the first
# errors as a repo issue, because Actions job logs need admin rights to read.
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'build.yaml'
      - '.github/workflows/debug-keymap.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: zmkfirmware/zmk/.github/actions/setup-west-action@main

      - name: Update west
        run: west update --narrow -o=--depth=1

      - name: Build cradio_left
        run: |
          set -o pipefail
          west build -d build_left -b nice_nano_v2 -s studio-rpc-usb-uart -- \
            -DSHIELD=cradio_left 2>&1 | tee build_left.log || true

      - name: Build cradio_right
        run: |
          set -o pipefail
          west build -d build_right -b nice_nano_v2 -- \
            -DSHIELD=cradio_right 2>&1 | tee build_right.log || true

      - name: Publish error excerpt as issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const grab = (file) => {
              if (!fs.existsSync(file)) return null;
              const lines = fs.readFileSync(file, 'utf8').split('\n');
              const hits = [];
              lines.forEach((l, i) => {
                if (/error|Error:|error:|FAILED|fatal/i.test(l)) {
                  for (let k = Math.max(0, i - 3); k < Math.min(lines.length, i + 8); k++) {
                    hits.push(lines[k]);
                  }
                  hits.push('---');
                }
              });
              return hits.slice(0, 120).join('\n');
            };
            const body = [
              '## Keymap build error report',
              '',
              '### cradio_left',
              '```',
              (grab('build_left.log') || 'no log captured').slice(0, 8000),
              '```',
              '',
              '### cradio_right',
              '```',
              (grab('build_right.log') || 'no log captured').slice(0, 8000),
              '```',
            ].join('\n');
            const { owner, repo } = context.repo;
            const title = 'Build error: ' + context.runId;
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

name: Debug keymap build
# Mirrors zmk's own build steps inside the zmk-build container, then publishes
# the first error blocks as a repo issue, because Actions job logs can only be
# read with admin rights.
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'build.yaml'
      - '.github/workflows/debug-keymap.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West Init
        working-directory: ${{ github.workspace }}
        run: west init -l "$GITHUB_WORKSPACE/config"

      - name: West Update
        working-directory: ${{ github.workspace }}
        run: west update --fetch-opt=--filter=tree:0

      - name: West Zephyr export
        working-directory: ${{ github.workspace }}
        run: west zephyr-export

      - name: Build cradio_left
        working-directory: ${{ github.workspace }}
        run: |
          west build -s zmk/app -d build_left -b nice_nano_v2 -S studio-rpc-usb-uart -- \
            -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DSHIELD=cradio_left > build_left.log 2>&1 || true
          tail -n 40 build_left.log

      - name: Build cradio_right
        working-directory: ${{ github.workspace }}
        run: |
          west build -s zmk/app -d build_right -b nice_nano_v2 -- \
            -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DSHIELD=cradio_right > build_right.log 2>&1 || true
          tail -n 40 build_right.log

      - name: Publish error excerpt as issue
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          def excerpt(path):
              if not os.path.exists(path):
                  return 'no log captured'
              lines = open(path, errors='ignore').read().split('\n')
              hits, seen = [], set()
              for i, line in enumerate(lines):
                  if re.search(r'error|Error:|FAILED|fatal', line):
                      for k in range(max(0, i - 3), min(len(lines), i + 8)):
                          if k not in seen:
                              seen.add(k)
                          hits.append(lines[k])
                      hits.append('---')
              return '\n'.join(hits[:200]) or '\n'.join(lines[-60:])

          body = (
              '## Keymap build error report\n\n'
              '### cradio_left\n```\n' + excerpt('build_left.log')[:6000] + '\n```\n\n'
              '### cradio_right\n```\n' + excerpt('build_right.log')[:6000] + '\n```\n'
          )
          title = 'Build error: run ' + os.environ.get('GITHUB_RUN_ID', 'manual')
          payload = json.dumps({'title': title, 'body': body}).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/void-vim/zmk-config-ferris-sweep/issues',
              data=payload,
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(req) as r:
              print('created issue', r.status)
          PY
